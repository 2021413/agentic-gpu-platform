# ---------------------------------------------------------------------------
# Continuous integration.
#
# NO GPU IS REQUIRED ANYWHERE IN THIS PIPELINE (spec sections 39 and 49):
#   * unit tests run without Docker and without a model;
#   * integration tests use PostgreSQL and Redis service containers;
#   * the end-to-end scenario uses the deterministic fake LLM worker;
#   * only the CPU API image is built here - the CUDA/vLLM image never is.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the run in progress for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  # --- static analysis -----------------------------------------------------
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check --output-format=github src tests

      - name: Ruff (format)
        run: ruff format --check src tests

      - name: mypy (strict)
        run: mypy

  # --- unit tests: no Docker, no GPU ---------------------------------------
  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and dev dependencies
        run: python -m pip install -e ".[dev]"

      # Includes tests/architecture: the dependency rule is checked on every push.
      - name: pytest (unit)
        run: pytest -m "not integration and not e2e" --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage.xml
          if-no-files-found: ignore

  # --- integration tests: real PostgreSQL and Redis ------------------------
  test-integration:
    name: Integration tests (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentic
          POSTGRES_PASSWORD: agentic
          POSTGRES_DB: agentic_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentic -d agentic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://agentic:agentic@localhost:5432/agentic_test
      REDIS_URL: redis://localhost:6379/0
      SERVICE_TOKEN: ci-service-token
      ENVIRONMENT: ci
      LOG_LEVEL: WARNING
      # The fake adapter keeps the whole workflow GPU-free.
      LLM_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and dev dependencies
        run: python -m pip install -e ".[dev]"

      # Runs as soon as the infrastructure layer ships alembic.ini.
      - name: Apply migrations
        if: hashFiles('alembic.ini') != ''
        run: alembic upgrade head

      # Exit code 5 means "nothing collected": expected while the layer that
      # owns these tests is still being written, and not a CI failure.
      - name: pytest (integration)
        run: |
          set +e
          pytest -m integration --color=yes
          code=$?
          if [ "$code" -eq 5 ]; then
            echo "::notice::no integration test collected yet"
            exit 0
          fi
          exit $code

      - name: pytest (end-to-end, fake worker)
        run: |
          set +e
          pytest -m e2e --color=yes
          code=$?
          if [ "$code" -eq 5 ]; then
            echo "::notice::no end-to-end test collected yet"
            exit 0
          fi
          exit $code

  # --- container build: CPU image only -------------------------------------
  docker-build:
    name: Build API image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The GPU image (docker/worker.Dockerfile) is deliberately NOT built
      # here: it derives from a multi-gigabyte CUDA/vLLM base and CI has no GPU.
      - name: Build docker/api.Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          load: true
          tags: agentic-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image smoke test (domain imports, console scripts installed)
        run: |
          docker run --rm agentic-api:ci python -c "import domain; print('domain ok')"
          docker run --rm agentic-api:ci sh -c 'command -v agentic-api && command -v agentic-worker'
