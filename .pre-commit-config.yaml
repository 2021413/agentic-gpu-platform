# Pre-commit hooks: the cheap half of CI, run before the commit exists.
# Install once with `make install` (or `make hooks`), then:
#   pre-commit run --all-files
#
# Versions are pinned; `pre-commit autoupdate` bumps them deliberately.
minimum_pre_commit_version: "3.5.0"

exclude: |
  (?x)^(
    \.venv/|
    \.mypy_cache/|
    \.ruff_cache/|
    \.pytest_cache/|
    htmlcov/
  )

repos:
  # --- file hygiene --------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-yaml
        # docker-compose.yml and the workflows must parse before they are pushed.
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-added-large-files
        # Model weights, datasets and archives belong in a volume, not in git.
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: debug-statements

  # --- secrets -------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        # Catches tokens and keys that detect-private-key does not know about
        # (SERVICE_TOKEN, HUGGING_FACE_HUB_TOKEN, cloud credentials...).

  # --- lint and format -----------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  # --- types ---------------------------------------------------------------
  # mypy runs from the project virtualenv rather than from an isolated one:
  # strict mode needs the real dependencies (pydantic plugin, SQLAlchemy,
  # FastAPI) and the package list configured in pyproject.toml.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, project venv)
        entry: .venv/bin/mypy
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      # A real .env holds SERVICE_TOKEN and possibly a Hugging Face token.
      # .env.example is the only environment file that may be committed.
      - id: forbid-dotenv
        name: never commit a .env file
        entry: "committing an environment file is forbidden; use .env.example"
        language: fail
        files: '^\.env(\..*)?$'
        exclude: '^\.env\.example$'
