[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os

# Timestamped, sortable revision files: reading ``alembic/versions`` in file
# order must match the order the migrations actually run in.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# The URL is intentionally absent: ``alembic/env.py`` reads DATABASE_URL from
# the environment so that no credential ever lands in a versioned file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
